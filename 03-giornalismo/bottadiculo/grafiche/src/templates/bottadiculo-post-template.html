<!--
  Template fisso — main image post singolo Bottadiculo (mercoledì/venerdì, no newsletter)
  Standardizzato il 07/09/2026, stessa logica del template newsletter
  (gambling-insights-cover-template.html) ma layout verticale a pannello unico, coerente con
  i post storici Bottadiculo (es. 2026-07-13-invisible-funnel-onboarding-kyc.html).
  Uso: copiare in ../../[data]-[slug]-cover.html, compilare solo kicker e H1, poi:
    ../../../04-linkedin/grafiche/render.sh png src/[data]-[slug]-cover.html [data]-[slug]-cover.png 1080x1350
  Formato 1080x1350 (4:5) — formato post singolo LinkedIn, non 1280x720 (quello è solo per
  la newsletter). Palette Bottadiculo reale: vedi ../../../palette-brand.md.
-->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  :root{
    --indigo:#1C0F3A; --indigo2:#150a2c; --arancio:#F9511F; --viola:#6330C7; --bianco:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{
    position:relative;
    background:linear-gradient(165deg, var(--indigo) 0%, var(--indigo2) 100%);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--bianco);
  }
  .blob{position:absolute;border-radius:50%;filter:blur(1px)}
  .blob1{width:340px;height:340px;background:var(--viola);opacity:.22;top:-120px;right:-120px}
  .blob2{width:220px;height:220px;background:var(--viola);opacity:.18;bottom:360px;left:-90px}

  .mark{position:absolute;top:96px;left:76px;width:150px;height:150px;transform:rotate(-6deg)}

  .content{
    position:absolute;left:0;right:0;bottom:0;padding:0 76px 56px;
  }
  .kicker{
    display:inline-flex;align-items:center;
    font-size:22px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--bianco);font-weight:700;margin-bottom:22px;
    background:var(--arancio);
    padding:8px 20px;border-radius:100px;
    width:fit-content;
  }
  h1{
    font-size:56px;line-height:1.16;font-weight:800;
    letter-spacing:-.01em;margin-bottom:34px;max-width:900px;
  }
  .footer{
    display:flex;justify-content:space-between;align-items:baseline;
    border-top:2px solid rgba(249,81,31,.35);padding-top:22px;
  }
  .byline{font-size:26px;font-weight:700}
  .tagline{font-size:22px;color:var(--arancio)}
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="mark">
    <svg width="150" height="150" viewBox="0 0 200 200">
      <rect x="0" y="0" width="200" height="200" rx="22" fill="#F9511F"/>
      <polyline points="118,0 100,38 122,58 92,104 118,132 108,200"
        fill="none" stroke="#1C0F3A" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="content">
    <div class="kicker">[Tema del pezzo]</div>
    <h1>[H1 — l'hook del post, la frase che ferma lo scroll]</h1>
    <div class="footer">
      <div class="byline">Bottadiculo</div>
      <div class="tagline">[GG mese AAAA]</div>
    </div>
  </div>
</body>
</html>
