<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  :root{
    --navy:#0D1B2A; --blu:#1B4F8A; --chiaro:#7DC8E0; --bianco:#F0F8FF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{
    position:relative;
    background:var(--navy) url("../inbox/brasile-visual.png") center 12% / cover no-repeat;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--bianco);
  }
  .scrim{
    position:absolute;left:0;right:0;bottom:0;height:62%;
    background:linear-gradient(180deg, rgba(13,27,42,0) 0%, rgba(13,27,42,.55) 28%, rgba(13,27,42,.94) 62%, var(--navy) 100%);
  }
  .content{
    position:absolute;left:0;right:0;bottom:0;padding:0 76px 56px;
  }
  .kicker{
    font-size:24px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--chiaro);font-weight:600;margin-bottom:20px;
  }
  h1{
    font-size:58px;line-height:1.14;font-weight:800;
    letter-spacing:-.01em;margin-bottom:34px;max-width:900px;
  }
  h1 .accent{color:var(--chiaro)}
  .footer{
    display:flex;justify-content:space-between;align-items:baseline;
    border-top:2px solid rgba(125,200,224,.35);padding-top:22px;
  }
  .byline{font-size:26px;font-weight:700}
  .byline span{color:var(--chiaro);font-weight:400}
  .tagline{font-size:22px;color:var(--chiaro)}
</style>
</head>
<body>
  <div class="scrim"></div>
  <div class="content">
    <div class="kicker">Bottadiculo · Brasile</div>
    <h1>L'avvertenza che nessuno può più <span class="accent">ignorare</span></h1>
    <div class="footer">
      <div class="byline">Alberto Lattuada <span>· Bottadiculo</span></div>
      <div class="tagline">Brasile · luglio 2026</div>
    </div>
  </div>
</body>
</html>
